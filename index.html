<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curtain Shop Manager Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#14263e;--teal:#17b8a3;--blue:#5684f5;--bg:#f3f6fb;--ink:#203148;--muted:#75849a;--line:#e5ebf3}
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer}
.primary{background:var(--teal);color:white}.secondary{background:#edf3fa;color:var(--navy)}.danger{background:#fff0f0;color:#c33e50}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}
.hidden{display:none!important}.muted,.sub{color:var(--muted)}.small{font-size:12px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e2fbf5,#f3f6ff)}
.login-card{width:min(460px,100%);background:white;border-radius:20px;padding:30px;box-shadow:0 15px 50px #14263e15}
.login-card h1{margin:10px 0}.login-card button{width:100%;margin-top:14px}
#app{display:flex;min-height:100vh}.sidebar{width:225px;flex-shrink:0;background:var(--navy);color:white;padding:18px 12px}
.brand{font-size:19px;font-weight:bold;padding:8px 8px 22px}.brand small{display:block;color:#8ee6d8;font-size:10px;letter-spacing:2px;margin-top:5px}
.navlabel{font-size:10px;letter-spacing:1.5px;color:#8da4bd;padding:13px 10px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;color:#c6d4e4;margin:3px 0}
.navbtn.active,.navbtn:hover{background:#ffffff18;color:white}
.sidebar-foot{margin-top:30px;padding:12px 8px;border-top:1px solid #ffffff22;font-size:12px;overflow-wrap:anywhere}
.main{flex:1;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;padding:16px 22px;border-bottom:1px solid var(--line)}
.topbar h2{margin:0;font-size:20px}.topbar p{margin:5px 0 0;color:var(--muted);font-size:12px}
.userpill{display:flex;align-items:center;gap:10px;font-size:12px}.content{max-width:1400px;margin:auto;padding:22px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.pagehead h3{margin:0 0 5px;font-size:22px}.pagehead p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}
.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;margin-top:12px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:bold;color:#53657a}
.full{grid-column:1/-1}.actions,.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.toolbar{margin:0 0 14px}
.toolbar input{flex:1;min-width:180px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:12px}
th{background:#f7f9fc;color:#718197}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:25px;color:var(--muted)}
.totalbox{max-width:370px;margin:16px 0 0 auto;background:#f7fafc;padding:15px;border-radius:10px}
.totalrow{display:flex;justify-content:space-between;padding:7px 0}.grand{font-size:18px;font-weight:bold;border-top:1px solid var(--line);padding-top:12px}
.notice{background:#eefbf8;border:1px solid #d5f5ee;color:#216f67;padding:12px;border-radius:9px;font-size:12px;line-height:1.6}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){#app{display:block}.sidebar{width:100%;padding:10px}.brand{padding-bottom:10px}.navlabel,.sidebar-foot{display:none}.navlist{display:flex;overflow:auto}.navbtn{width:auto;white-space:nowrap}.topbar{padding:12px}.content{padding:12px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.grid{gap:8px}.stat,.panel{padding:12px}}
@media print{.sidebar,.topbar,.no-print{display:none!important}#app{display:block}.content{padding:0}.panel{border:0}body{background:white}}
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <h1>Curtain Shop Manager Pro</h1>
    <p>Manage customers, measurements and professional quotations in one place.</p>
    <div class="notice">Sign in with an authorized Google account to continue.</div>
    <button class="primary" id="googleBtn">Continue with Google</button>
    <p id="loginMsg" class="small muted">Secure sign-in required.</p>
  </div>
</section>

<section id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">CURTAIN MANAGER<small>PRO WORKSPACE</small></div>
    <div class="navlabel">WORKSPACE</div>
    <div class="navlist">
      <button class="navbtn active" data-page="dashboard">Dashboard</button>
      <button class="navbtn" data-page="customers">Customers</button>
      <button class="navbtn" data-page="measurements">Measurements</button>
      <button class="navbtn" data-page="quotation">Create Quotation</button>
      <button class="navbtn" data-page="saved">Saved Quotes</button>
    </div>
    <div class="navlabel">PREFERENCES</div>
    <button class="navbtn" data-page="settings">Shop Settings</button>
    <div class="sidebar-foot" id="sideEmail"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h2 id="topTitle">Dashboard</h2><p id="topSub">Your shop at a glance</p></div>
      <div class="userpill"><span id="userEmail"></span><button class="secondary" id="logoutBtn">Sign Out</button></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</section>

<script>
/* SUPABASE CONFIGURATION */
const SUPABASE_URL = "https://bhlttsdmlzrqerhwdozm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_B0SUM02iSibnEyDTpnVBdw_21pxeAtW";

/* Do not use a service_role key in browser code. */
const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(n)||0);
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now() + Math.floor(Math.random()*10000);
let sb=null,currentUser=null,access=null,page="dashboard";

function read(k, fallback) {
  try { return JSON.parse(localStorage.getItem("csm_"+k) || JSON.stringify(fallback)); }
  catch { return fallback; }
}
function write(k,v) { localStorage.setItem("csm_"+k,JSON.stringify(v)); }

let customers=read("customers",[]);
let measurements=read("measurements",[]);
let quotes=read("quotes",[]);
let settings=read("settings",{shopName:"Homestyle Curtains",phone:"",address:"",gst:"",logo:""});

function setupSupabase(){
  if(!window.supabase || SUPABASE_ANON_KEY.includes("PASTE_")) return false;
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  return true;
}

$("#googleBtn").onclick=async()=>{
  if(!setupSupabase()){
    $("#loginMsg").textContent="Setup required: add your Supabase public key to the code.";
    return;
  }
  $("#googleBtn").disabled=true;
  $("#loginMsg").textContent="Opening Google sign-in...";
  const {error}=await sb.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:location.href}
  });
  if(error){
    $("#loginMsg").textContent="Sign-in failed: "+error.message;
    $("#googleBtn").disabled=false;
  }
};

async function checkAccess(user){
  currentUser=user;
  $("#loginMsg").textContent="Checking account authorization...";
  const {data,error}=await sb.from("authorized_users")
    .select("email,is_active,is_paid,plan_name,trial_ends_at")
    .eq("email",user.email).maybeSingle();

  if(error){
    $("#loginMsg").textContent="Could not verify access. Check authorized_users table permissions and try again.";
    return;
  }
  if(!data || data.is_active!==true){
    $("#loginMsg").textContent="This Google account is not authorized. Contact the administrator.";
    await sb.auth.signOut();
    return;
  }

  const isAdmin=String(data.plan_name||"").toLowerCase()==="admin";
  const trialValid=!!data.trial_ends_at && new Date(data.trial_ends_at)>=new Date();
  if(!isAdmin && data.is_paid!==true && !trialValid){
    $("#loginMsg").textContent="Your access is not active. Contact the administrator.";
    await sb.auth.signOut();
    return;
  }

  access=data;
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#userEmail").textContent=user.email;
  $("#sideEmail").textContent=user.email+" · "+(isAdmin?"Administrator":"Authorized User");
  render();
}

async function boot(){
  if(!setupSupabase()) return;
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) await checkAccess(session.user);
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==="SIGNED_IN" && session?.user) await checkAccess(session.user);
    if(event==="SIGNED_OUT"){
      $("#app").classList.add("hidden");
      $("#login").classList.remove("hidden");
      $("#loginMsg").textContent="Signed out successfully.";
    }
  });
}

const pageInfo={
 dashboard:["Dashboard","Your shop at a glance"],
 customers:["Customers","Manage customer contact details"],
 measurements:["Measurements","Record room and window measurements"],
 quotation:["Create Quotation","Prepare a quotation for your customer"],
 saved:["Saved Quotes","Review and print saved quotations"],
 settings:["Shop Settings","Update business details and manage backups"]
};

function head(title,subtitle,action=""){
 return `<div class="pagehead"><div><h3>${title}</h3><p>${subtitle}</p></div>${action}</div>`;
}
function customerOptions(selected=""){
 return `<option value="">Select customer</option>`+customers.map(c=>`<option ${c.name===selected?"selected":""}>${esc(c.name)}</option>`).join("");
}
function customerRows(list=customers){
 return list.length?list.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||"—")}</td><td>${esc(c.address||"—")}</td><td>${measurements.filter(m=>m.customer===c.name).length}</td><td><button class="secondary" data-viewc="${c.id}">Measurements</button> <button class="danger" data-delc="${c.id}">Delete</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">No customers saved.</td></tr>`;
}
function measurementRows(list=measurements){
 return list.length?list.map(m=>`<tr><td>${esc(m.customer||"—")}</td><td>${esc(m.area)}</td><td>${esc(m.type)}</td><td>${m.width} × ${m.height} cm</td><td>${(Number(m.width||0)*Number(m.height||0)/929.0304*Number(m.qty||1)).toFixed(2)}</td><td>${esc(m.unit)}</td><td><button class="danger" data-delm="${m.id}">Delete</button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">No measurements saved.</td></tr>`;
}
function quoteRows(list=quotes){
 return list.slice().reverse().map(q=>`<tr><td>${esc(q.ref)}</td><td>${esc(q.date)}</td><td>${esc(q.customer)}</td><td>${money(q.total)}</td><td>${q.items.length}</td><td><button class="secondary" data-printq="${q.id}">Print</button> <button class="danger" data-delq="${q.id}">Delete</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No saved quotations.</td></tr>`;
}
function itemRow(){
 return `<tr><td><input class="iname" placeholder="Curtain or blinds item"></td><td><input class="iqty" type="number" min="0" value="1"></td><td><select class="iunit"><option>Sq.Ft</option><option>Rft</option><option>Nos</option><option>Meter</option><option>Set</option><option>Item</option></select></td><td><input class="irate" type="number" min="0" value="0"></td><td class="iamount">${money(0)}</td><td><button class="danger idel">×</button></td></tr>`;
}

const pages={
 dashboard:()=>head("Dashboard","Welcome to your workspace")+`
 <div class="grid">
 <div class="stat"><span>Customers</span><strong>${customers.length}</strong></div>
 <div class="stat"><span>Measurements</span><strong>${measurements.length}</strong></div>
 <div class="stat"><span>Quotations</span><strong>${quotes.length}</strong></div>
 <div class="stat"><span>Access Status</span><strong style="font-size:20px">${access?.is_paid||String(access?.plan_name).toLowerCase()==="admin"?"Active":"Trial"}</strong></div>
 </div>
 <div class="panel"><h3>Quick Actions</h3><div class="actions">
 <button class="primary" data-go="customers">Add Customer</button>
 <button class="primary" data-go="measurements">Add Measurement</button>
 <button class="primary" data-go="quotation">Create Quotation</button>
 <button class="secondary" data-go="saved">View Saved Quotes</button>
 </div><p class="notice" style="margin-top:18px">Important: business records are stored in this browser only. Cloud data synchronization has not been configured in this version.</p></div>`,

 customers:()=>head("Customers","Manage customer details",`<button class="primary" id="newC">+ Add Customer</button>`)+`
 <div id="cForm" class="panel hidden"><h3>Customer Details</h3><div class="formgrid">
 <div class="field"><label>Full Name *</label><input id="cn"></div>
 <div class="field"><label>Phone Number</label><input id="cp" type="tel"></div>
 <div class="field full"><label>Address</label><textarea id="ca" rows="2"></textarea></div>
 </div><div class="actions"><button class="primary" id="saveC">Save Customer</button><button class="secondary" id="cancelC">Cancel</button></div></div>
 <div class="panel"><div class="toolbar"><input id="searchC" placeholder="Search customers..."></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Measurements</th><th>Actions</th></tr></thead><tbody id="customerRows">${customerRows()}</tbody></table></div></div>`,

 measurements:()=>head("Measurements","Record each room or window measurement",`<button class="primary" id="newM">+ Add Measurement</button>`)+`
 <div id="mForm" class="panel hidden"><h3>New Measurement</h3><div class="formgrid">
 <div class="field"><label>Customer</label><select id="mc">${customerOptions()}</select></div>
 <div class="field"><label>Area / Room *</label><input id="ma" placeholder="Living room"></div>
 <div class="field"><label>Curtain Type</label><select id="mt"><option>Cloth Curtain</option><option>Ripple Curtain</option><option>Eyelet Curtain</option><option>Blackout Curtain</option><option>Zebra Blinds</option><option>Roman Blinds</option><option>Roller Blinds</option><option>Wooden Blinds</option><option>Other</option></select></div>
 <div class="field"><label>Unit</label><select id="mu"><option>Sq.Ft</option><option>Rft</option><option>Meter</option><option>Nos</option><option>Set</option><option>Item</option></select></div>
 <div class="field"><label>Width (cm)</label><input id="mw" type="number" min="0"></div>
 <div class="field"><label>Height (cm)</label><input id="mh" type="number" min="0"></div>
 <div class="field"><label>Quantity / Panels</label><input id="mq" type="number" min="1" value="1"></div>
 <div class="field"><label>Notes</label><input id="mn"></div></div>
 <div class="actions"><button class="primary" id="saveM">Save Measurement</button><button class="secondary" id="cancelM">Cancel</button></div></div>
 <div class="panel"><div class="toolbar"><input id="searchM" placeholder="Search customer, room or type..."></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Area</th><th>Type</th><th>Width × Height</th><th>Area (Sq.Ft)</th><th>Unit</th><th>Action</th></tr></thead><tbody id="measurementRows">${measurementRows()}</tbody></table></div></div>`,

 quotation:()=>head("Create Quotation","Add items and calculate the total",`<button class="secondary no-print" id="printNow">Print / Save PDF</button>`)+`
 <div class="panel"><div class="formgrid">
 <div class="field"><label>Customer</label><input id="qc" list="customerNames" placeholder="Enter customer name"><datalist id="customerNames">${customers.map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist></div>
 <div class="field"><label>Date</label><input id="qd" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Phone</label><input id="qp"></div>
 <div class="field"><label>Quote Reference</label><input id="qr" value="QT-${Date.now().toString().slice(-6)}"></div></div>
 <div class="tablewrap" style="margin-top:18px"><table><thead><tr><th>Item / Description</th><th>Qty</th><th>Unit</th><th>Rate (₹)</th><th>Amount</th><th></th></tr></thead><tbody id="quoteItems">${itemRow()}</tbody></table></div>
 <div class="actions no-print"><button class="secondary" id="addItem">+ Add Item</button></div>
 <div class="formgrid" style="margin-top:18px">
 <div class="field"><label>Discount Type</label><select id="discountType"><option value="percent">Percentage (%)</option><option value="fixed">Fixed Amount (₹)</option></select></div>
 <div class="field"><label>Discount Value</label><input id="discountValue" type="number" min="0" value="0"></div>
 <div class="field"><label>GST (%)</label><input id="gstValue" type="number" min="0" value="0"></div>
 <div class="field"><label>Notes / Terms</label><input id="qnotes" placeholder="Validity, installation, payment terms"></div></div>
 <div class="totalbox"><div class="totalrow"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="totalrow"><span>Discount</span><b id="discountTotal">₹0</b></div><div class="totalrow"><span>GST</span><b id="taxTotal">₹0</b></div><div class="totalrow grand"><span>Grand Total</span><b id="grandTotal">₹0</b></div></div>
 <div class="actions no-print"><button class="primary" id="saveQ">Save Quotation</button><button class="secondary" id="clearQ">Clear Items</button></div></div>`,

 saved:()=>head("Saved Quotes","Review, print or delete saved quotations")+`
 <div class="panel"><div class="toolbar"><input id="searchQ" placeholder="Search customer or quote reference..."></div><div class="tablewrap"><table><thead><tr><th>Reference</th><th>Date</th><th>Customer</th><th>Total</th><th>Items</th><th>Actions</th></tr></thead><tbody id="quoteRows">${quoteRows()}</tbody></table></div></div>`,

 settings:()=>head("Shop Settings","Business details and data backup")+`
 <div class="panel"><div class="formgrid">
 <div class="field"><label>Shop / Business Name</label><input id="shopName" value="${esc(settings.shopName)}"></div>
 <div class="field"><label>Phone</label><input id="shopPhone" value="${esc(settings.phone)}"></div>
 <div class="field full"><label>Address</label><textarea id="shopAddress" rows="2">${esc(settings.address)}</textarea></div>
 <div class="field"><label>GSTIN (Optional)</label><input id="shopGST" value="${esc(settings.gst)}"></div>
 <div class="field"><label>Logo Image URL (Optional)</label><input id="shopLogo" value="${esc(settings.logo)}"></div></div>
 <div class="actions"><button class="primary" id="saveSettings">Save Settings</button></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
 <h3>Data Backup</h3><p class="sub">Export your records regularly so you can restore them if needed.</p>
 <div class="notice">Records are currently stored in this browser. Signing in on another device will not automatically transfer your records.</div>
 <div class="actions"><button class="secondary" id="exportBackup">Export Backup</button><button class="secondary" id="importBackup">Import Backup</button><button class="danger" id="clearData">Delete All Local Data</button><input id="backupFile" type="file" accept="application/json" class="hidden"></div></div>`
};

function render(){
 const [title,subtitle]=pageInfo[page];
 $("#topTitle").textContent=title;$("#topSub").textContent=subtitle;
 document.querySelectorAll(".navbtn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 $("#content").innerHTML=pages[page]();
 bindPage();
}
function go(p){page=p;render();}

function bindPage(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));

 if(page==="customers"){
  $("#newC").onclick=()=>$("#cForm").classList.remove("hidden");
  $("#cancelC").onclick=()=>$("#cForm").classList.add("hidden");
  $("#saveC").onclick=()=>{
   const name=$("#cn").value.trim();if(!name)return alert("Enter the customer name.");
   customers.push({id:uid(),name,phone:$("#cp").value.trim(),address:$("#ca").value.trim()});
   write("customers",customers);render();
  };
  $("#searchC").oninput=()=>$("#customerRows").innerHTML=customerRows(customers.filter(c=>(c.name+" "+c.phone+" "+c.address).toLowerCase().includes($("#searchC").value.toLowerCase())));
  document.querySelectorAll("[data-delc]").forEach(b=>b.onclick=()=>{
   if(confirm("Delete this customer?")){
    customers=customers.filter(c=>c.id!=b.dataset.delc);write("customers",customers);render();
   }
  });
  document.querySelectorAll("[data-viewc]").forEach(b=>b.onclick=()=>{
   const c=customers.find(x=>x.id==b.dataset.viewc);go("measurements");
   setTimeout(()=>{if($("#searchM")){$("#searchM").value=c.name;$("#searchM").dispatchEvent(new Event("input"));}},0);
  });
 }

 if(page==="measurements"){
  $("#newM").onclick=()=>$("#mForm").classList.remove("hidden");
  $("#cancelM").onclick=()=>$("#mForm").classList.add("hidden");
  $("#saveM").onclick=()=>{
   const area=$("#ma").value.trim();if(!area)return alert("Enter the area or room name.");
   const width=Number($("#mw").value),height=Number($("#mh").value),qty=Number($("#mq").value)||1;
   if(width<=0||height<=0)return alert("Enter a valid width and height.");
   measurements.push({id:uid(),customer:$("#mc").value,area,type:$("#mt").value,unit:$("#mu").value,width,height,qty,notes:$("#mn").value.trim()});
   write("measurements",measurements);render();
  };
  $("#searchM").oninput=()=>$("#measurementRows").innerHTML=measurementRows(measurements.filter(m=>(m.customer+" "+m.area+" "+m.type).toLowerCase().includes($("#searchM").value.toLowerCase())));
  document.querySelectorAll("[data-delm]").forEach(b=>b.onclick=()=>{
   if(confirm("Delete this measurement?")){measurements=measurements.filter(m=>m.id!=b.dataset.delm);write("measurements",measurements);render();}
  });
 }

 if(page==="quotation"){
  $("#addItem").onclick=()=>{$("#quoteItems").insertAdjacentHTML("beforeend",itemRow());bindItems();};
  $("#clearQ").onclick=()=>{$("#quoteItems").innerHTML=itemRow();bindItems();};
  $("#printNow").onclick=()=>window.print();
  ["discountType","discountValue","gstValue"].forEach(id=>$("#"+id).oninput=calculateQuote);
  $("#qc").oninput=()=>{const c=customers.find(c=>c.name===$("#qc").value);if(c)$("#qp").value=c.phone||"";};
  $("#saveQ").onclick=()=>{
   const items=getItems();if(!items.length)return alert("Add at least one item with a description.");
   const total=calculateQuote();
   quotes.push({id:uid(),ref:$("#qr").value.trim()||("QT-"+Date.now()),date:$("#qd").value,customer:$("#qc").value.trim(),phone:$("#qp").value.trim(),notes:$("#qnotes").value.trim(),items,total,shop:{...settings}});
   write("quotes",quotes);alert("Quotation saved successfully.");go("saved");
  };
  bindItems();
 }

 if(page==="saved"){
  $("#searchQ").oninput=()=>$("#quoteRows").innerHTML=quoteRows(quotes.filter(q=>(q.customer+" "+q.ref).toLowerCase().includes($("#searchQ").value.toLowerCase())));
  document.querySelectorAll("[data-delq]").forEach(b=>b.onclick=()=>{if(confirm("Delete this quotation?")){quotes=quotes.filter(q=>q.id!=b.dataset.delq);write("quotes",quotes);render();}});
  document.querySelectorAll("[data-printq]").forEach(b=>b.onclick=()=>printQuote(quotes.find(q=>q.id==b.dataset.printq)));
 }

 if(page==="settings"){
  $("#saveSettings").onclick=()=>{
   settings={shopName:$("#shopName").value.trim(),phone:$("#shopPhone").value.trim(),address:$("#shopAddress").value.trim(),gst:$("#shopGST").value.trim(),logo:$("#shopLogo").value.trim()};
   write("settings",settings);alert("Settings saved.");render();
  };
  $("#exportBackup").onclick=()=>{
   const blob=new Blob([JSON.stringify({customers,measurements,quotes,settings},null,2)],{type:"application/json"});
   const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="curtain-manager-backup.json";a.click();URL.revokeObjectURL(a.href);
  };
  $("#importBackup").onclick=()=>$("#backupFile").click();
  $("#backupFile").onchange=async e=>{
   try{
    const file=e.target.files[0];if(!file)return;
    const d=JSON.parse(await file.text());
    customers=Array.isArray(d.customers)?d.customers:[];
    measurements=Array.isArray(d.measurements)?d.measurements:[];
    quotes=Array.isArray(d.quotes)?d.quotes:[];
    settings=d.settings||settings;
    write("customers",customers);write("measurements",measurements);write("quotes",quotes);write("settings",settings);
    alert("Backup restored successfully.");render();
   }catch{alert("Invalid backup file.");}
  };
  $("#clearData").onclick=()=>{
   if(confirm("Delete all locally stored customers, measurements, quotations and settings?")){
    if(confirm("This cannot be undone. Continue?")){
     customers=[];measurements=[];quotes=[];
     settings={shopName:"Homestyle Curtains",phone:"",address:"",gst:"",logo:""};
     write("customers",customers);write("measurements",measurements);write("quotes",quotes);write("settings",settings);
     render();
    }
   }
  };
 }
}

function bindItems(){
 document.querySelectorAll("#quoteItems tr").forEach(tr=>{
  tr.querySelectorAll("input,select").forEach(el=>el.oninput=calculateQuote);
  tr.querySelector(".idel").onclick=()=>{if($("#quoteItems").children.length>1)tr.remove();calculateQuote();};
 });
 calculateQuote();
}
function getItems(){
 return [...document.querySelectorAll("#quoteItems tr")].map(tr=>({
  name:tr.querySelector(".iname").value.trim(),
  qty:Number(tr.querySelector(".iqty").value)||0,
  unit:tr.querySelector(".iunit").value,
  rate:Number(tr.querySelector(".irate").value)||0
 })).filter(i=>i.name).map(i=>({...i,amount:i.qty*i.rate}));
}
function calculateQuote(){
 const items=getItems(),subtotal=items.reduce((s,i)=>s+i.amount,0);
 const val=Math.max(0,Number($("#discountValue")?.value)||0);
 let discount=$("#discountType")?.value==="percent"?subtotal*val/100:val;
 discount=Math.min(discount,subtotal);
 const taxable=subtotal-discount;
 const tax=taxable*Math.max(0,Number($("#gstValue")?.value)||0)/100;
 const total=taxable+tax;
 if($("#subtotal"))$("#subtotal").textContent=money(subtotal);
 if($("#discountTotal"))$("#discountTotal").textContent=money(discount);
 if($("#taxTotal"))$("#taxTotal").textContent=money(tax);
 if($("#grandTotal"))$("#grandTotal").textContent=money(total);
 document.querySelectorAll("#quoteItems tr").forEach(tr=>{
  tr.querySelector(".iamount").textContent=money((Number(tr.querySelector(".iqty").value)||0)*(Number(tr.querySelector(".irate").value)||0));
 });
 return total;
}
function printQuote(q){
 if(!q)return;
 const w=window.open("","_blank");if(!w)return alert("Allow pop-ups to print the quotation.");
 w.document.write(`<html><head><title>${esc(q.ref)}</title><style>body{font:14px Arial;padding:35px;color:#223}h1{color:#147d78}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;font-size:20px;font-weight:bold;margin-top:25px}</style></head><body><h1>${esc(q.shop?.shopName||"Curtain Shop")}</h1><p>${esc(q.shop?.address||"")}<br>${esc(q.shop?.phone||"")}</p><hr><h2>Quotation</h2><p>Reference: ${esc(q.ref)}<br>Date: ${esc(q.date)}<br>Customer: ${esc(q.customer)}<br>Phone: ${esc(q.phone)}</p><table><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Amount</th></tr>${q.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${esc(i.unit)}</td><td>${money(i.rate)}</td><td>${money(i.amount)}</td></tr>`).join("")}</table><div class="total">Grand Total: ${money(q.total)}</div><p>${esc(q.notes||"")}</p><p style="margin-top:55px">Thank you for your business.</p><script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();
}

document.querySelectorAll(".navbtn[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
$("#logoutBtn").onclick=async()=>{if(sb)await sb.auth.signOut();};
boot();
</script>
</body>
